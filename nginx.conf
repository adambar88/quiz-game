server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' wss: ws: https: http: wss://*.peerjs.com wss://0.peerjs.com; frame-ancestors 'none'" always;

    # Log all requests to stdout
    access_log /dev/stdout;
    error_log /dev/stderr;

    # Health check endpoint for Coolify
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    # Server proxy for OpenClaw Azure OpenAI endpoint (prevents CORS and hides API key)
    location /mindclash/api/ai/ {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;
        proxy_pass https://adam-barczynski-resource.openai.azure.com/openai/v1/;
        proxy_ssl_server_name on;
        proxy_set_header Host adam-barczynski-resource.openai.azure.com;
        proxy_set_header api-key "${OPENCLAW_API_KEY}";
        proxy_set_header Authorization "Bearer ${OPENCLAW_API_KEY}";
    }

    location /mindclash/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /mindclash/index.html;
    }

    # Hashed static assets can be cached aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location = / {
        return 301 /mindclash/;
    }
}
